<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="style.css" />
  <style>
    .portal-zona { background: var(--gray-soft); padding: 34px 16px 70px; }

      width: 100%; max-width: 560px; margin: 0 auto; height: 640px;

    .portal-fallback { text-align: center; margin-top: 18px; color: var(--gray-mid); font-size: .9rem; }
    .portal-fallback a { color: var(--ucb-blue2); font-weight: 600; }

<body>

<div id="site-nav"></div>

  <div class="page-header">

  </div>

  <section class="portal-zona">
    <iframe class="portal-embed"
      src="https://script.google.com/macros/s/AKfycbxQtNgH4JWtMi32vrLcbdPdqXR4PnA84ddxI5z-IEh9FfL_gFwh-c3XZUyu6cSi_IdIIw/exec"

      <a href="https://script.google.com/macros/s/AKfycbxQtNgH4JWtMi32vrLcbdPdqXR4PnA84ddxI5z-IEh9FfL_gFwh-c3XZUyu6cSi_IdIIw/exec"

<script src="script.js"></script>
